<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>GG Place IMS</title>

    <!-- Content Security Policy (CSP) to allow external CDNs -->
    <!-- IMPORTANT: This meta tag MUST be exactly as below and ideally the ONLY CSP definition -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com;
      img-src 'self' data: https://placehold.co;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' https://fonts.googleapis.com https://generativelanguage.googleapis.com;
    ">

    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Chart.js and React-Chartjs-2 CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-chartjs-2@4.0.0/dist/index.min.js"></script>
    
    <!-- Link for Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">If you see this, React did not render.</div>
  </body>
</html>
